name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py core.py knowledge.py
      - name: Validate release metadata
        run: |
          test -s VERSION
          grep -q "^## \[0.1.0\]" CHANGELOG.md
          git diff --check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run smoke test
        run: python smoke_test.py
      - name: Build Docker image
        run: docker build -t cook-assistant .
      - name: Start container and check health endpoint
        run: |
          docker run -d --name cook-assistant-test -p 8765:8765 \
            -e APP_PASSWORD=test_password_here cook-assistant
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs cook-assistant-test
          exit 1
